kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
    labels:
      workload: sandpit
      tier: worker-a
  - role: worker
    labels:
      workload: sandpit
      tier: worker-b